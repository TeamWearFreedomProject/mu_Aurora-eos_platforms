name: Aurora UEFI (experimental compile only)

on:
  workflow_dispatch:
  push:
    branches: ['Aurora&eos-port']
    paths:
      - 'Platforms/AuroraPkg/**'
      - 'Platforms/QcomModulePkg/**'
      - 'Platforms/SelunaPkg/**'
      - 'Silicon/QC/Sw5100/**'
      - 'BootShim/**'
      - 'ImageResources/bootstrap.bin'
      - 'ImageResources/mkbootimg.py'
      - 'build_fd_aurora.sh'
      - 'build_bootshim_aurora.sh'
      - 'build_uefi_aurora.sh'
      - 'tools/validate_aurora_bootimg.py'
      - 'tools/check_aurora_memorymap.py'
      - 'tools/test_aurora_memorymap.py'
      - '.github/workflows/aurora-build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check packaging source syntax before expensive build
        run: |
          bash -n build_fd_aurora.sh build_bootshim_aurora.sh build_uefi_aurora.sh
          python3 -m py_compile tools/validate_aurora_bootimg.py tools/check_aurora_memorymap.py
          python3 tools/check_aurora_memorymap.py
          python3 -m unittest discover -s tools -p 'test_aurora_memorymap.py' -v

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev clang llvm lld gcc-aarch64-linux-gnu mono-devel build-essential python3-pip python3-venv

      - name: Set up Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r pip-requirements.txt

      - name: Initialize upstream build dependencies
        run: |
          python3 Platforms/AuroraPkg/PlatformBuild.py --setup -t RELEASE
          python3 Platforms/AuroraPkg/PlatformBuild.py --update -t RELEASE

      - name: Compile Aurora firmware volumes
        run: bash ./build_fd_aurora.sh

      - name: Publish firmware volumes (UNVERIFIED)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-uefi-unverified-fd
          if-no-files-found: error
          path: ImageResources/Aurora/*.fd

      - name: Compile inherited-address Aurora BootShim
        run: bash ./build_bootshim_aurora.sh

      - name: Assemble and structurally verify boot images
        run: bash ./build_uefi_aurora.sh

      - name: Publish experimental image research artifacts (DO NOT FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-EXPERIMENTAL-DO-NOT-FLASH-img
          if-no-files-found: error
          compression-level: 3
          path: |
            ImageResources/Aurora/*.img
            ImageResources/Aurora/*.manifest.json
            BootShim/BootShim.Aurora.bin

      - name: Publish build logs even when compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-uefi-build-logs
          if-no-files-found: warn
          path: |
            Build/BUILDLOG_AuroraPkg.txt
            Build/AuroraPkg/RELEASE_CLANGPDB/OVERRIDELOG.TXT
            Build/AuroraPkg/RELEASE_CLANGPDB/BUILD_TOOLS_REPORT/**
